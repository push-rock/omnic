name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cc: gcc
          - os: ubuntu-22.04
            cc: clang
          - os: ubuntu-22.04
            cc: clang
            san: tsan
          - os: macos-15
            cc: clang
          - os: windows-latest
            cc: cl
          - os: windows-latest
            cc: gcc
            gen: "MinGW Makefiles"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: configure
        # CC 环境变量对 VS 生成器无效；windows+gcc 需显式 MinGW 生成器；
        # tsan 档 Debug + -O1（T13）：三方静态库继承 CFLAGS，全树 instrument
        shell: bash
        run: |
          if [ "${{ matrix.san }}" = "tsan" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Debug \
              "-DCMAKE_C_FLAGS=-fsanitize=thread -fno-omit-frame-pointer -O1" \
              -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread \
              -DXZ_SANDBOX=no
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.gen && format('-G "{0}"', matrix.gen) || '' }}
          fi
        env:
          CC: ${{ matrix.cc }}
      - name: build
        shell: bash
        run: |
          echo "::add-matcher::.github/gcc-problem-matcher.json"
          cmake --build build -j --config Release 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "::remove-matcher owner=gcc::"
          exit $code
      - name: dump compiler errors as annotations
        if: failure()
        shell: bash
        run: |
          grep -iE 'error|undefined|warning.*error' build.log | grep -v '^--' | head -30 | while IFS= read -r line; do
            msg=$(echo "$line" | cut -c1-250)
            echo "::error::${msg}"
          done
      - name: upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}-${{ matrix.cc }}
          path: build.log
          if-no-files-found: ignore
      - name: test
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ matrix.san }}" = "tsan" ]; then
            # TSan 5-15x 慢：只跑两个池所在的套件，bench/fuzz 冒烟跳过
            ctest --test-dir build --output-on-failure -R "core|archive" 2>&1 | tee test.log
          else
            ctest --test-dir build --output-on-failure -C Release 2>&1 | tee test.log
          fi
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            # 共享 runner 偶发调度干扰重跑一次；真实回归重跑仍挂，门禁效力不变
            ctest --test-dir build --output-on-failure --rerun-failed -C Release 2>&1 | tee -a test.log
            code=${PIPESTATUS[0]}
          fi
          exit $code
      - name: dump test failures as annotations
        if: failure()
        shell: bash
        run: |
          # 分两段发：先断言失败行（最关键，且在日志靠前的位置——test_archive 的输出
          # 后面还跟着 bench/fuzz 的几百行，单纯取尾部会被它们挤掉），再发 ctest 自己
          # 的总结（Passed/Failed/超时/Not Run）。都不限定行首，避免漏掉超时和崩溃。
          {
            echo "--- assertion failures ---"
            grep -nE 'FAIL|checks, [0-9]+ failed|Assertion|Sanitizer|runtime error|Segmentation|Timed out|\*\*\*' test.log | head -40
            echo "--- ctest summary ---"
            grep -nE 'Test +#[0-9]+:|tests passed|tests failed|The following tests|Total Test time' test.log | tail -n 20
          } | while IFS= read -r line; do
            printf '::error title=ctest::%s\n' "$(printf '%s' "$line" | cut -c1-250)"
          done
          exit 0
      - name: upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}-${{ matrix.cc }}
          path: test.log
          if-no-files-found: ignore
