name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cc: gcc
          - os: ubuntu-22.04
            cc: clang
          - os: macos-14
            cc: clang
          - os: windows-latest
            cc: cl
          - os: windows-latest
            cc: gcc
            gen: "MinGW Makefiles"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: configure
        # CC 环境变量对 VS 生成器无效；windows+gcc 需显式 MinGW 生成器
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.gen && format('-G "{0}"', matrix.gen) || '' }}
        env:
          CC: ${{ matrix.cc }}
      - name: build
        shell: bash
        run: |
          echo "::add-matcher::.github/gcc-problem-matcher.json"
          cmake --build build -j --config Release 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "::remove-matcher owner=gcc::"
          exit $code
      - name: dump compiler errors as annotations
        if: failure()
        shell: bash
        run: |
          grep -iE 'error|undefined|warning.*error' build.log | grep -v '^--' | head -30 | while IFS= read -r line; do
            msg=$(echo "$line" | cut -c1-250)
            echo "::error::${msg}"
          done
      - name: upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}-${{ matrix.cc }}
          path: build.log
          if-no-files-found: ignore
      - name: test
        run: ctest --test-dir build --output-on-failure -C Release
