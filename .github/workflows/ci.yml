name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cc: gcc
          - os: ubuntu-22.04
            cc: clang
          - os: macos-14
            cc: clang
          - os: windows-latest
            cc: cl
          - os: windows-latest
            cc: gcc
            gen: "MinGW Makefiles"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: configure
        # CC 环境变量对 VS 生成器无效；windows+gcc 需显式 MinGW 生成器
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.gen && format('-G "{0}"', matrix.gen) || '' }}
        env:
          CC: ${{ matrix.cc }}
      - name: build
        run: cmake --build build -j --config Release
      - name: test
        run: ctest --test-dir build --output-on-failure -C Release
